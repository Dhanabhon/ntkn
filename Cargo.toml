[package]
name = "ntkn"
version = "0.11.4"
edition = "2024"
authors = ["Tom Dhanabhon <tom@dhanabhon.com>"]
homepage = "https://github.com/dhanabhon/ntkn"
repository = "https://github.com/dhanabhon/ntkn"
description = "Local token tracker for AI agents."
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
comfy-table = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
