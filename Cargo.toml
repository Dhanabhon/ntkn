[package]
name = "ntkn"
version = "0.1.0"
edition = "2024"
authors = ["Tom Dhanabhon <tom@dhanabhon.com>"]
description = "ntkn (นับ token) — A blazing fast, lightweight CLI TUI written in Rust to count project tokens across all LLM providers."

[dependencies]
# TUI & Terminal Handling
ratatui = "0.30.0"
crossterm = "0.29.0"

# Fast File Scanning (Respecting .gitignore)
ignore = "0.4.25"

# Tokenizers
tiktoken-rs = "0.11.0"
tokenizers = "0.23.1"

# Extras
clap = { version = "4.6", features = ["derive"] }